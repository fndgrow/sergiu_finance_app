# Casieria EHL — nginx site. install.sh copies this to /etc/nginx/sites-available/casieria,
# replacing __DOMAIN__ and __PORT__, and certbot adds the TLS listener.
server {
    server_name __DOMAIN__ www.__DOMAIN__;
    listen 80;
    listen [::]:80;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;   # never in a search engine
    add_header Strict-Transport-Security "max-age=31536000" always;
    # the API answers only the app's own origin (PocketBase would say "*"); the app and the API share the domain
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "https://__DOMAIN__" always;

    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # the admin UI and the superuser / settings / logs / backups endpoints are managed on the server itself, never from the internet
    # (both by name and by PocketBase's fixed ids, so the superuser sign-in cannot be reached as /api/collections/pbc_…)
    location ~ ^/(_/|api/settings|api/logs|api/backups|api/collections/(_superusers|pbc_3142635823|users|_pb_users_auth_)(/|$)) { return 404; }

    # the owner's weekly backup archives: random, unlisted links that backup-weekly.sh makes and deletes after 3 days
    location ^~ /backup/ {
        alias /var/lib/casieria-backups/;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "private, no-store" always;
    }

    # the app (pb_public) and the API come from PocketBase
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 600s;   # realtime (SSE) connections stay open
        proxy_buffering off;
    }
}
